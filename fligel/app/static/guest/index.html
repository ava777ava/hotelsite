<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Ваше проживание</title>
<style>
:root {
  --ink: #1C2420; --paper: #F4F3EE; --surface: #fff; --border: #DCDFD6; --muted: #5F6A59;
  --pine: #2F5D50; --pine-2: #264C41; --pine-soft: #E1EBE6; --clay: #B4562E; --clay-soft: #F5E0D5; --ochre: #C1852B;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --ink: #E7EAE4; --paper: #111614; --surface: #1A211F; --border: #34403B; --muted: #A5B0A0; --pine: #7FB5A3; --pine-2: #9CCBB9; --pine-soft: #22332E; --clay: #E58A62; --clay-soft: #3A2A22; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 26px; line-height: 1.2; margin: 8px 0 6px; font-weight: 650; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 0 0 18px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; color: var(--muted); font-weight: 600; margin-bottom: 14px; }
.input { height: 46px; border: 1px solid var(--border); border-radius: 9px; padding: 0 12px; background: var(--surface); color: var(--ink); width: 100%; font: inherit; font-weight: 400; }
textarea.input { height: 96px; padding: 10px 12px; resize: vertical; }
.input:focus { outline: 2px solid var(--pine); outline-offset: 1px; }
.btn { height: 48px; border-radius: 10px; border: 0; background: var(--pine); color: #fff; font: inherit; font-weight: 600; padding: 0 22px; cursor: pointer; width: 100%; }
@media (prefers-color-scheme: dark) { .btn { color: #0F1512; } }
.btn:disabled { opacity: .55; }
.note { background: var(--pine-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 0 0 16px; }
.err { background: var(--clay-soft); color: var(--clay); border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; font-size: 14px; }
.stars { display: flex; gap: 8px; margin: 6px 0 18px; }
.star { flex: 1; height: 56px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); color: var(--ink); font-size: 22px; cursor: pointer; }
.star[aria-checked=true] { border-color: var(--pine); background: var(--pine-soft); color: var(--pine); font-weight: 700; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.done { text-align: center; padding: 28px 10px; }
.done .big { font-size: 44px; }
footer { color: var(--muted); font-size: 12.5px; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<div class="wrap" id="root"><p class="sub">Загрузка…</p></div>
<script>
(function () {
  var m = location.pathname.match(/^\/(f|r)\/([A-Za-z0-9_-]+)\/?$/);
  var root = document.getElementById('root');
  function el(tag, attrs) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { if (k === 'class') e.className = attrs[k]; else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c == null || c === false) continue; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }
    return e;
  }
  function fmt(s) { var p = String(s).slice(0, 10).split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
  function api(method, body) {
    return fetch('/api/public/' + (m[1] === 'f' ? 'form' : 'review') + '/' + m[2], { method: method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.error || 'Что-то пошло не так. Попробуйте ещё раз'); return d; }); });
  }
  function show() { root.textContent = ''; for (var i = 0; i < arguments.length; i++) root.appendChild(arguments[i]); }
  function fail(msg) { show(el('h1', {}, 'Ссылка не работает'), el('p', { class: 'sub' }, msg)); }
  function thanks(title, text) { show(el('div', { class: 'card done' }, el('div', { class: 'big', 'aria-hidden': 'true' }, '✓'), el('h1', {}, title), el('p', { class: 'sub' }, text))); }
  if (!m) return fail('Проверьте адрес — возможно, ссылка скопирована не полностью.');

  function renderForm(d) {
    document.title = 'Анкета гостя — ' + d.property.name;
    var arrival = el('input', { class: 'input', type: 'time', value: d.answers.arrival_time || '' });
    var guests = el('input', { class: 'input', type: 'number', min: '1', max: '30', value: String(d.answers.guests_count || 1), inputmode: 'numeric' });
    var car = el('input', { class: 'input', type: 'text', maxlength: '20', value: d.answers.car_number || '', autocomplete: 'off', placeholder: 'А123БВ 116 (если приедете на машине)' });
    var wishes = el('textarea', { class: 'input', maxlength: '1000', placeholder: 'Детская кроватка, поздний заезд, тишина, аллергия на перья…' }, d.answers.wishes || '');
    var err = el('div', { class: 'err', role: 'alert', style: 'display:none' });
    var btn = el('button', { class: 'btn', type: 'submit' }, d.filled ? 'Обновить ответы' : 'Отправить');
    var form = el('form', { class: 'card', novalidate: '', onsubmit: function (e) {
      e.preventDefault(); err.style.display = 'none'; btn.disabled = true;
      api('POST', { arrival_time: arrival.value, guests_count: guests.value, car_number: car.value, wishes: wishes.value })
        .then(function () { thanks('Спасибо!', 'Мы всё записали и ждём вас ' + fmt(d.check_in) + '.'); })
        .catch(function (ex) { err.textContent = ex.message; err.style.display = ''; btn.disabled = false; });
    } },
      err,
      el('div', { class: 'note' }, 'Паспортные данные не нужны — только то, что поможет нам лучше подготовиться. Ответы видит только администратор гостиницы.'),
      el('div', { class: 'row' }, el('label', {}, 'Во сколько приедете', arrival), el('label', {}, 'Сколько гостей', guests)),
      el('label', {}, 'Номер машины (для парковки)', car),
      el('label', {}, 'Пожелания', wishes), btn);
    show(el('h1', {}, d.guest ? d.guest + ', ждём вас!' : 'Ждём вас!'),
      el('p', { class: 'sub' }, d.property.name + ', ' + fmt(d.check_in) + ' — ' + fmt(d.check_out) + (d.property.address ? '. ' + d.property.address : '')),
      d.editable ? form : el('p', { class: 'sub' }, 'Проживание уже закончилось.'),
      el('footer', {}, d.property.phone ? 'Вопросы — звоните: ' + d.property.phone : ''));
  }

  function renderReview(d) {
    document.title = 'Оцените проживание — ' + d.property.name;
    if (!d.can_review) return show(el('h1', {}, 'Отзыв — после заезда'), el('p', { class: 'sub' }, 'Эта ссылка заработает, когда вы заедете в ' + d.property.name + '.'));
    var rating = d.rating || 0;
    var stars = el('div', { class: 'stars', role: 'radiogroup', 'aria-label': 'Оценка от 1 до 5' });
    var btns = [];
    function paint() { btns.forEach(function (b, i) { b.setAttribute('aria-checked', String(i + 1 === rating)); }); }
    [1, 2, 3, 4, 5].forEach(function (n) {
      var b = el('button', { type: 'button', class: 'star', role: 'radio', 'aria-label': n + ' из 5', onclick: function () { rating = n; paint(); } }, String(n));
      btns.push(b); stars.appendChild(b);
    });
    paint();
    var comment = el('textarea', { class: 'input', maxlength: '2000', placeholder: 'Что понравилось, что можно улучшить' }, d.comment || '');
    var err = el('div', { class: 'err', role: 'alert', style: 'display:none' });
    var btn = el('button', { class: 'btn', type: 'submit' }, d.submitted ? 'Обновить отзыв' : 'Отправить');
    var form = el('form', { class: 'card', novalidate: '', onsubmit: function (e) {
      e.preventDefault(); err.style.display = 'none';
      if (!rating) { err.textContent = 'Выберите оценку от 1 до 5'; err.style.display = ''; return; }
      btn.disabled = true;
      api('POST', { rating: rating, comment: comment.value })
        .then(function () { thanks('Спасибо за отзыв!', 'Он помогает нам становиться лучше. Будем рады видеть вас снова.'); })
        .catch(function (ex) { err.textContent = ex.message; err.style.display = ''; btn.disabled = false; });
    } }, err, el('label', {}, 'Как вам проживание? (1 — плохо, 5 — отлично)', stars), el('label', {}, 'Комментарий (необязательно)', comment), btn);
    show(el('h1', {}, d.guest ? d.guest + ', как всё прошло?' : 'Как всё прошло?'),
      el('p', { class: 'sub' }, d.property.name + ', ' + fmt(d.check_in) + ' — ' + fmt(d.check_out)), form,
      el('footer', {}, 'Отзыв увидит только администрация — он нигде не публикуется.'));
  }

  api('GET').then(function (d) { (m[1] === 'f' ? renderForm : renderReview)(d); }).catch(function (ex) { fail(ex.message); });
})();
</script>
</body>
</html>
