# Заголовки при проксировании на приложение. X-Forwarded-For задаём из реального адреса клиента ($remote_addr),
# а не дописываем к присланному — иначе клиент мог бы подделать адрес и обойти лимиты запросов по IP.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
