# /etc/nginx/sites-available/fligel — затем: ln -s ../sites-available/fligel /etc/nginx/sites-enabled/
# Сертификат HTTPS: certbot --nginx -d booking.example.ru

# /etc/nginx/fligel_proxy.conf (создаёт setup.sh): заголовки прокси; X-Forwarded-For ставим сами из реального адреса,
# а не дописываем к присланному клиентом — иначе адрес можно подделать и обойти лимиты по IP
limit_req_zone $binary_remote_addr zone=fligel_public:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=fligel_auth:10m rate=10r/m;

server {
    listen 80;
    server_name booking.example.ru;

    client_max_body_size 4m;   # фото номеров (до 2 МБ, в base64 ≈ 2,7 МБ) и CSV-импорт

    # Защита от перебора паролей и спама заявками
    location /api/auth/ {
        limit_req zone=fligel_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/fligel_proxy.conf;
    }
    location ~ ^/api/public/.+/book$ {
        limit_req zone=fligel_public burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/fligel_proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/fligel_proxy.conf;
    }
}
